<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="tc-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="12" fill="url(#tc-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="674" rx="11.5" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Window Header -->
  <path d="M0 12C0 5.373 5.373 0 12 0h1176c6.627 0 12 5.373 12 12v36H0V12z" fill="#141416"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#262626" stroke-width="1"/>
  <circle cx="24" cy="24" r="5" fill="#ef4444"/>
  <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="24" r="5" fill="#10b981"/>
  <text x="600" y="29" fill="#737373" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">TaskCo — Task Management Application</text>

  <!-- Top App Navigation -->
  <rect x="0" y="48" width="1200" height="56" fill="#17171c"/>
  <line x1="0" y1="104" x2="1200" y2="104" stroke="#262626" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="30" y="64" width="24" height="24" rx="6" fill="#3b82f6"/>
  <text x="64" y="81" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">TaskCo</text>

  <!-- Filter tabs -->
  <rect x="180" y="62" width="80" height="28" rx="6" fill="#26262e"/>
  <text x="220" y="80" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">All Tasks</text>
  <text x="300" y="80" fill="#737373" font-family="system-ui, sans-serif" font-size="12" font-weight="500">In Progress</text>
  <text x="390" y="80" fill="#737373" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Completed</text>

  <!-- Sync status -->
  <circle cx="1080" cy="76" r="4" fill="#10b981"/>
  <text x="1092" y="80" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Supabase Connected</text>

  <!-- Main Grid Layout -->
  <!-- Left Column: Task Lists -->
  <text x="40" y="146" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">My Workspace</text>
  <text x="40" y="166" fill="#737373" font-family="system-ui, sans-serif" font-size="12">Real-time sync enabled</text>

  <!-- Task Card 1 (Active) -->
  <rect x="40" y="190" width="700" height="96" rx="8" fill="#1c1c22" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="56" y="210" width="20" height="20" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Implement Supabase Authentication &amp; RLS Policies</text>
  <text x="90" y="248" fill="#8e8e93" font-family="system-ui, sans-serif" font-size="12">Configure user authorization rules to restrict access to row-level data.</text>
  <rect x="630" y="210" width="90" height="24" rx="12" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="675" y="226" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">In Progress</text>

  <!-- Task Card 2 -->
  <rect x="40" y="300" width="700" height="96" rx="8" fill="#17171c" stroke="#262626"/>
  <rect x="56" y="320" width="20" height="20" rx="4" fill="none" stroke="#52525b" stroke-width="2"/>
  <text x="90" y="335" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Design Responsive Kanban Dashboard</text>
  <text x="90" y="358" fill="#8e8e93" font-family="system-ui, sans-serif" font-size="12">Adapt layout for mobile screen breakpoints using Tailwind CSS.</text>
  <rect x="630" y="320" width="90" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="675" y="336" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">To Do</text>

  <!-- Task Card 3 (Completed) -->
  <rect x="40" y="410" width="700" height="96" rx="8" fill="#17171c" stroke="#262626"/>
  <rect x="56" y="430" width="20" height="20" rx="4" fill="#10b981"/>
  <path d="M62 440l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="90" y="445" fill="#737373" font-family="system-ui, sans-serif" font-size="15" font-weight="600" style="text-decoration: line-through;">Setup React Context API for Global Auth State</text>
  <text x="90" y="468" fill="#52525b" font-family="system-ui, sans-serif" font-size="12">Store current user sessions without prop-drilling or extra libraries.</text>
  <rect x="630" y="430" width="90" height="24" rx="12" fill="#10b981" fill-opacity="0.15"/>
  <text x="675" y="446" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Done</text>

  <!-- Right Column: Task Detail Panel -->
  <rect x="760" y="130" width="400" height="500" rx="8" fill="#17171c" stroke="#262626"/>
  <text x="790" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Task Details</text>
  <line x1="760" y1="190" x2="1160" y2="190" stroke="#262626" stroke-width="1"/>

  <text x="790" y="225" fill="#737373" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TITLE</text>
  <text x="790" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Implement Supabase Authentication</text>

  <text x="790" y="290" fill="#737373" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DESCRIPTION</text>
  <text x="790" y="312" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Create authentication modal with login/register tabs. Link session to PostgreSQL database with Row Level Security.</text>

  <text x="790" y="380" fill="#737373" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TECHNOLOGIES</text>
  <rect x="790" y="395" width="70" height="24" rx="4" fill="#26262e"/>
  <text x="825" y="411" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">React.js</text>
  <rect x="868" y="395" width="80" height="24" rx="4" fill="#26262e"/>
  <text x="908" y="411" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Supabase</text>
  <rect x="956" y="395" width="90" height="24" rx="4" fill="#26262e"/>
  <text x="1001" y="411" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Tailwind CSS</text>

  <text x="790" y="465" fill="#737373" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SUBTASKS</text>
  <rect x="790" y="485" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="816" y="498" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Setup AuthProvider Context</text>
  <rect x="790" y="515" width="16" height="16" rx="3" fill="none" stroke="#52525b"/>
  <text x="816" y="528" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Write RLS SQL policies in Supabase dashboard</text>
</svg>
